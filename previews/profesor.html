<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Panel de profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  /* --- реальный CSS из ProfesorCabinetPage.vue --- */
  .esc-page { font-family: 'Hanken Grotesk', -apple-system, Helvetica, Arial, sans-serif; font-weight: 300; color: #1c1c1c; background: #f6f3ef; min-height: 100vh; }
  .esc-hero { background: #0e0c0c; padding: 52px 32px; }
  .esc-hero-container { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 22px; }
  .esc-hero-avatar { display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: #8e1519; color: #fff; font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 600; flex-shrink: 0; }
  .esc-hero-tag { display: inline-block; font-size: 13px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: #c49a3f; margin-bottom: 8px; }
  .esc-hero-title { font-family: 'Playfair Display', serif; font-size: 34px; line-height: 1.1; font-weight: 600; color: #ffffff; margin: 0; letter-spacing: -0.3px; }
  .esc-shell { max-width: 1180px; margin: 0 auto; padding: 48px 32px 88px; }
  .esc-block + .esc-block { margin-top: 40px; }
  .esc-section-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: #15110f; margin: 0 0 24px; letter-spacing: -0.3px; }
  .esc-empty { background: #ffffff; border: 1px solid #ece7e1; border-radius: 18px; padding: 48px 32px; text-align: center; }
  .esc-empty-text { font-size: 16px; color: #6b6259; margin: 0; }
</style>
</head>
<body>
<div class="esc-page">
  <section class="esc-hero">
    <div class="esc-hero-container">
      <span class="esc-hero-avatar">A</span>
      <div>
        <span class="esc-hero-tag">Panel de profesor</span>
        <h1 class="esc-hero-title">Hola, Ana</h1>
      </div>
    </div>
  </section>

  <div class="esc-shell">
    <section class="esc-block">
      <h2 class="esc-section-title">Mis cursos</h2>
      <div class="esc-empty">
        <p class="esc-empty-text">Todavía no tienes cursos asignados.</p>
      </div>
    </section>

    <section class="esc-block">
      <h2 class="esc-section-title">Tareas por revisar</h2>
      <div class="esc-empty">
        <p class="esc-empty-text">No hay tareas pendientes de revisión.</p>
      </div>
    </section>
  </div>
</div>
</body>
</html>
