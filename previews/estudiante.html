<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Panel de estudiante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  /* --- реальный CSS из EstudianteCabinetPage.vue --- */
  .esc-page { font-family: 'Hanken Grotesk', -apple-system, Helvetica, Arial, sans-serif; font-weight: 300; color: #1c1c1c; background: #f6f3ef; min-height: 100vh; }
  .esc-hero { background: #0e0c0c; padding: 52px 32px; }
  .esc-hero-container { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 22px; }
  .esc-hero-avatar { display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: #8e1519; color: #fff; font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 600; flex-shrink: 0; }
  .esc-hero-tag { display: inline-block; font-size: 13px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: #c49a3f; margin-bottom: 8px; }
  .esc-hero-title { font-family: 'Playfair Display', serif; font-size: 34px; line-height: 1.1; font-weight: 600; color: #ffffff; margin: 0; letter-spacing: -0.3px; }
  .esc-shell { max-width: 1180px; margin: 0 auto; padding: 48px 32px 88px; }
  .esc-section-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: #15110f; margin: 0 0 24px; letter-spacing: -0.3px; }
  .esc-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .esc-course { background: #ffffff; border: 1px solid #ece7e1; border-radius: 18px; padding: 22px; text-decoration: none; color: inherit; display: block; transition: border-color 0.3s; }
  .esc-course:hover { border-color: #8e1519; }
  .esc-course-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 600; color: #15110f; margin: 0 0 6px; }
  .esc-course-teacher { font-size: 13.5px; color: #8a8079; margin: 0 0 16px; }
  .esc-progress { display: flex; justify-content: space-between; font-size: 13.5px; color: #8a8079; margin-bottom: 8px; }
  .esc-progress-value { font-weight: 600; color: #8e1519; }
  .esc-progress-bar { height: 7px; border-radius: 4px; background: #f0ebe5; overflow: hidden; }
  .esc-progress-fill { height: 100%; border-radius: 4px; background: #8e1519; transition: width 0.3s; }
</style>
</head>
<body>
<div class="esc-page">
  <section class="esc-hero">
    <div class="esc-hero-container">
      <span class="esc-hero-avatar">I</span>
      <div>
        <span class="esc-hero-tag">Panel de estudiante</span>
        <h1 class="esc-hero-title">Hola, Irina</h1>
      </div>
    </div>
  </section>

  <div class="esc-shell">
    <h2 class="esc-section-title">Mis cursos</h2>
    <div class="esc-courses">
      <a href="#" class="esc-course">
        <h3 class="esc-course-title">Recupera tu Energía</h3>
        <p class="esc-course-teacher">Irina Karbonova</p>
        <div class="esc-progress"><span>Progreso</span><span class="esc-progress-value">72%</span></div>
        <div class="esc-progress-bar"><div class="esc-progress-fill" style="width:72%"></div></div>
      </a>
      <a href="#" class="esc-course">
        <h3 class="esc-course-title">El Camino del Propósito</h3>
        <p class="esc-course-teacher">Irina Karbonova, Ana Ruiz</p>
        <div class="esc-progress"><span>Progreso</span><span class="esc-progress-value">30%</span></div>
        <div class="esc-progress-bar"><div class="esc-progress-fill" style="width:30%"></div></div>
      </a>
      <a href="#" class="esc-course">
        <h3 class="esc-course-title">Hábitos que Transforman</h3>
        <p class="esc-course-teacher">Irina Karbonova</p>
        <div class="esc-progress"><span>Progreso</span><span class="esc-progress-value">100%</span></div>
        <div class="esc-progress-bar"><div class="esc-progress-fill" style="width:100%"></div></div>
      </a>
    </div>
  </div>
</div>
</body>
</html>
