version: '3.8'

services:
  backend:
    build: ./backend
    container_name: mentored_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/static:/app/static
      - ./backend/db.sqlite3:/app/db.sqlite3  # 👈 МОНТИРУЕМ БАЗУ
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True

  nginx:
    image: nginx:alpine
    container_name: mentored_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/media:/media
      - ./backend/static:/static
    depends_on:
      - backend