version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mentored_db
    restart: always
    environment:
      POSTGRES_DB: mentored
      POSTGRES_USER: mentored_user
      POSTGRES_PASSWORD: 1qkn?!D/h&dk!2~
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mentored_user -d mentored" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mentored_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/static:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mentored_frontend
    restart: always
    volumes:
      - ./frontend/dist:/app/dist  # МОНТИРУЕМ ПАПКУ DIST
    # Запускаем сборку, а потом выходим
    command: sh -c "npm run build && sleep infinity"
    # ИЛИ для однократной сборки:
    # command: npm run build
    #profiles:
    #  - build

  nginx:
    image: nginx:alpine
    container_name: mentored_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/media:/media
      - ./backend/static:/static
      - /root/certbot/www:/var/www/certbot
      - /root/certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
    #  - frontend

  redis:
    image: redis:7-alpine
    container_name: mentored_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build: ./backend
    container_name: mentored_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=2
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - .env

  celery_beat:
    build: ./backend
    container_name: mentored_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - .env

volumes:
  pgdata:
  redis_data: