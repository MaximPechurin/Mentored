version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mentored_db
    restart: always
    environment:
      POSTGRES_DB: mentored
      POSTGRES_USER: mentored_user
      POSTGRES_PASSWORD: 1qkn?!D/h&dk!2~
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mentored_user -d mentored" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mentored_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/static:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mentored_frontend
    restart: always
    volumes:
      - ./frontend/dist:/app/dist  # МОНТИРУЕМ ПАПКУ DIST
    # Запускаем сборку, а потом выходим
    command: sh -c "npm run build && sleep infinity"
    # ИЛИ для однократной сборки:
    # command: npm run build
    profiles:
      - build

  nginx:
    image: nginx:alpine
    container_name: mentored_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/media:/media
      - ./backend/static:/static
    depends_on:
      - backend
      - frontend  # 👈 Ждём фронт

volumes:
  pgdata: