upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name mentoredgroup.com www.mentoredgroup.com;

    # ----- ACME-CHALLENGE (certbot, webroot-метод) -----
    # Нужен и после первого выпуска сертификата - для последующих продлений.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное с http - на https.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mentoredgroup.com www.mentoredgroup.com;

    ssl_certificate     /etc/letsencrypt/live/mentoredgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentoredgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # ----- ФРОНТЕНД -----
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # ----- СТАТИКА -----
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- МЕДИА -----
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- API -----
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- АДМИНКА -----
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
