upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name mentoredgroup.com www.mentoredgroup.com;

    client_max_body_size 20M;

    # ----- ACME-CHALLENGE (certbot, webroot-метод) -----
    # Нужно ДО выпуска сертификата - certbot кладёт сюда файл-пруф, Let's
    # Encrypt проверяет его по http://<domain>/.well-known/acme-challenge/...
    # Оставляем и после выпуска - нужен для последующих продлений.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ----- ФРОНТЕНД -----
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # ----- СТАТИКА -----
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- МЕДИА -----
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- API -----
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- АДМИНКА -----
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}